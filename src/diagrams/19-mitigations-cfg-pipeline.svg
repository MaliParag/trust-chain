<polygon points="254.0,400.5 258.0,392.0 250.0,392.0" fill="#4a5568"/>
<line x1="474.0" y1="444.3" x2="605.5" y2="444.3" stroke="#2b6a4c" stroke-width="1.5" stroke-dasharray="4,3"/>
<polygon points="612.0,444.3 603.5,440.3 603.5,448.3" fill="#2b6a4c"/>
<line x1="254.0" y1="488.0" x2="254.0" y2="539.5" stroke="#8d2d3b" stroke-width="1.5"/>
<polygon points="254.0,546.0 258.0,537.5 250.0,537.5" fill="#8d2d3b"/>
<rect x="512.0" y="434.9" width="45.4" height="18.8" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="534.7" y="446.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#2b6a4c" text-anchor="middle">bit = 1</text>
<rect x="210.3" y="504.2" width="87.3" height="18.8" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="254.0" y="515.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#8d2d3b" text-anchor="middle">invalid target</text>
</svg>
