[book]
title = "The Linux Trust Chain"
authors = ["Parag Mali"]
description = "How modern Linux composes UEFI shim, Unified Kernel Images, TPM2, dm-verity, LSMs, eBPF, namespaces, and Confidential Computing into an end-to-end chain of trust, and where attackers break the seams."
src = "src"
language = "en"

[build]
build-dir = "book"
create-missing = false

[preprocessor.trustchain]
command = "node ../../tools/mdbook-trustchain.mjs"
renderers = ["html"]

[output.html]
theme = "../../theme"
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/MaliParag/trust-chain"
edit-url-template = "https://github.com/MaliParag/trust-chain/edit/main/books/linux/src/{path}"
additional-css = ["../../theme/trustchain.css"]
additional-js = ["../../theme/preview-banner.js"]
site-url = "/trust-chain/linux/"
no-section-label = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2

[output.html.print]
enable = true
