<text x="208.0" y="54.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="700" letter-spacing="0.60px" fill="#8d2d3b" text-anchor="middle">PRIVACY / ANTI-THEFT DESIGN</text>
