<text x="460.0" y="393.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">TXM (GL0) Trust Cache / CoreTrust Anchor + XNU vm_fault Page-In Gate</text>
<text x="460.0" y="412.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Binds metadata slots and 4 KB code pages into a single 20-byte CDHash; page mismatch clears CS_VALID and triggers SIGKILL under CS_KILL</text>
<text x="460.0" y="455.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Every negative metadata digest and positive 4 KB page digest sits inside CS_CodeDirectory, so mutating entitlements or resources changes CDHash.</text>
