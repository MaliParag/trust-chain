<text x="460.0" y="390.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">Compile-Time checkpolicy neverallow Assertions + CTS SELinuxHostTest</text>
<text x="460.0" y="409.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Refuses to sign/certify any OEM image containing permissive domains or overly broad vendor allow rules</text>
<text x="460.0" y="452.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Since Android 5.0, zero processes run unconfined; CTS verifies every shipping OEM policy satisfies all AOSP neverallow invariants.</text>
