<text x="450.0" y="339.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">krbtgt Long-Term Key Set (Current + Previous History Slots)</text>
<text x="450.0" y="357.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="middle">Encrypts outer TGT EncTicketPart AND keys all four TGT PAC signatures; DCSync theft</text>
<text x="450.0" y="371.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="middle">enables Golden/Diamond/Sapphire forgery</text>
<text x="450.0" y="414.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Evicting a compromised krbtgt key requires two password resets separated by &gt; MaxTicketAge (10h) plus full Tier-0 remediation.</text>
