<text x="704.5" y="134.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">bits &amp; FS UUID</text>
<rect x="26.0" y="184.8" width="868.0" height="73.0" rx="6.0" fill="#e6f4ec" stroke="#2b6a4c" stroke-width="1.4"/>
<text x="460.0" y="206.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#1e5139" text-anchor="middle">RING 0 METADATA AUTHENTICATOR (SECURITY/INTEGRITY/EVM/EVM_CRYPTO.C)</text>
<text x="460.0" y="222.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">evm_calc_hmac_or_hash() Keyed by TPM 2.0 Sealed Kernel Master Key (evm-key)</text>
<text x="460.0" y="240.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Computes HMAC-SHA256 (mutable files) or verifies EVM_XATTR_PORTABLE_DIGSIG asymmetric vendor signature</text>
<rect x="26.0" y="315.8" width="868.0" height="73.0" rx="6.0" fill="#f8eaec" stroke="#8d2d3b" stroke-width="1.4"/>
<text x="460.0" y="337.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#6e1f2b" text-anchor="middle">OFFLINE TAMPER VERDICT (EVM_VERIFYXATTR -&gt; SECURITY.EVM)</text>
<text x="460.0" y="353.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">Blocks Offline chmod +s SUID Escalation, Label Stripping, and Cross-Inode Xattr Transplant</text>
<text x="460.0" y="371.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Any offline disk edit to uid/gid/mode or protected xattrs invalidates security.evm and returns -EACCES / -EPERM</text>
<text x="460.0" y="414.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Without EVM (or a read-only dm-verity Merkle tree), security.ima authenticates file bytes while leaving chmod +s and labels exposed.</text>
