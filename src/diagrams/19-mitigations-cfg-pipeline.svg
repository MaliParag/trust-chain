<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 648" width="860" height="648">
<rect x="0" y="0" width="860" height="648" fill="#ffffff"/>
<text x="430.0" y="24.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.0" font-weight="700" letter-spacing="0.90px" fill="#365378" text-anchor="middle">CONTROL FLOW GUARD (CFG / XFG) COMPILE-TO-RUNTIME PIPELINE</text>
<rect x="36.0" y="48.0" width="450.0" height="87.5" rx="6.0" fill="#edf1f6" stroke="#365378" stroke-width="1.4"/>
<text x="50.0" y="69.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#284163" text-anchor="start">1 · MSVC COMPILER (/GUARD:CF)</text>
<text x="50.0" y="85.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Emit Guard Check Before Every Indirect Call</text>
<text x="50.0" y="104.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Replaces raw call rax with call [__guard_dispatch_icall_fptr] passing</text>
<text x="50.0" y="118.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">target in RAX (and 55-bit type hash in R10 under XFG)</text>
<rect x="36.0" y="161.5" width="450.0" height="87.5" rx="6.0" fill="#edf1f6" stroke="#365378" stroke-width="1.4"/>
<text x="50.0" y="183.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#284163" text-anchor="start">2 · LINKER (/GUARD:CF + /DYNAMICBASE)</text>
<text x="50.0" y="199.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Build Sorted Guard CF Function Table (GFIDS)</text>
<text x="50.0" y="217.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Records RVA of every valid address-taken function in</text>
<text x="50.0" y="231.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">IMAGE_LOAD_CONFIG_DIRECTORY (no-op if /DYNAMICBASE omitted)</text>
<rect x="36.0" y="275.0" width="450.0" height="87.5" rx="6.0" fill="#e6f3f1" stroke="#236b66" stroke-width="1.4"/>
<text x="50.0" y="296.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#19524e" text-anchor="start">3 · KERNEL / NTDLL IMAGE LOADER</text>
<text x="50.0" y="312.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Populate Sparse Per-Process CFG Bitmap</text>
<text x="50.0" y="331.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Maps 1 bit per 8-byte aligned slot across user virtual address space as</text>
<text x="50.0" y="345.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">DLLs load</text>
<rect x="36.0" y="388.5" width="450.0" height="73.3" rx="6.0" fill="#f9f1e1" stroke="#b07926" stroke-width="1.4"/>
<text x="50.0" y="410.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#875a14" text-anchor="start">4 · RUNTIME INDIRECT CALL</text>
<text x="50.0" y="426.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">LdrpValidateUserCallTarget Checks Target Bit</text>
<text x="50.0" y="444.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Indexes CFG bitmap (and XFG prototype hash preceding target function)</text>
<rect x="582.0" y="389.6" width="246.0" height="71.2" rx="6.0" fill="#e6f4ec" stroke="#2b6a4c" stroke-width="1.4"/>
<text x="596.0" y="411.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#1e5139" text-anchor="start">VALID TARGET</text>
<text x="596.0" y="426.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Call Proceeds</text>
<text x="596.0" y="444.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="400" fill="#433e38" text-anchor="start">Jumps to verified function entry</text>
<rect x="36.0" y="507.8" width="450.0" height="87.5" rx="6.0" fill="#f8eaec" stroke="#8d2d3b" stroke-width="1.4"/>
<text x="50.0" y="529.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#6e1f2b" text-anchor="start">BIT CLEAR / HASH MISMATCH</text>
<text x="50.0" y="545.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">__fastfail(FAST_FAIL_GUARD_ICALL_CHECK_FAILURE)</text>
<text x="50.0" y="564.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Int 0x29 traps directly into kernel (bypassing SEH handlers) with</text>
<text x="50.0" y="578.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">0xC0000409 termination</text>
<text x="430.0" y="619.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Forward-edge CFG/XFG constrains indirect calls/jumps; backward-edge Intel CET hardware Shadow Stacks protect RET addresses.</text>
<line x1="261.0" y1="135.5" x2="261.0" y2="155.0" stroke="#4a5568" stroke-width="1.5"/>
<polygon points="261.0,161.5 264.8,153.5 257.2,153.5" fill="#4a5568"/>
<line x1="261.0" y1="249.0" x2="261.0" y2="268.5" stroke="#4a5568" stroke-width="1.5"/>
<polygon points="261.0,275.0 264.8,267.0 257.2,267.0" fill="#4a5568"/>
<line x1="261.0" y1="362.5" x2="261.0" y2="382.0" stroke="#4a5568" stroke-width="1.5"/>
<polygon points="261.0,388.5 264.8,380.5 257.2,380.5" fill="#4a5568"/>
<line x1="486.0" y1="425.2" x2="575.5" y2="425.2" stroke="#2b6a4c" stroke-width="1.5" stroke-dasharray="4,3"/>
<polygon points="582.0,425.2 574.0,421.4 574.0,429.0" fill="#2b6a4c"/>
<line x1="261.0" y1="461.8" x2="261.0" y2="501.3" stroke="#8d2d3b" stroke-width="1.5"/>
<polygon points="261.0,507.8 264.8,499.8 257.2,499.8" fill="#8d2d3b"/>
<rect x="511.0" y="415.6" width="46.1" height="19.1" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="534.0" y="427.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="400" fill="#2b6a4c" text-anchor="middle">bit = 1</text>
<rect x="216.6" y="475.3" width="88.8" height="19.1" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="261.0" y="486.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="400" fill="#8d2d3b" text-anchor="middle">invalid target</text>
</svg>
