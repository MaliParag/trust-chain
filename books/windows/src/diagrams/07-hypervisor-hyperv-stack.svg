<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470">
<rect x="0" y="0" width="920" height="470" fill="#ffffff"/>
<text x="460.0" y="24.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.0" font-weight="700" letter-spacing="0.90px" fill="#365378" text-anchor="middle">HYPER-V TYPE-1 MICRO-KERNEL PARTITIONING ARCHITECTURE</text>
<rect x="26.0" y="52.0" width="472.2" height="101.2" rx="6.0" fill="#e6f3f1" stroke="#236b66" stroke-width="1.4"/>
<text x="40.0" y="73.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#19524e" text-anchor="start">ROOT PARTITION (HOST OS)</text>
<text x="40.0" y="89.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="start">Full Windows Kernel + VSPs + vmwp.exe</text>
<text x="40.0" y="108.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">Owns physical drivers, vmswitch.sys, ACPI/PCI, and per-VM worker</text>
<text x="40.0" y="122.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">processes; isolated from hypervisor Ring -1</text>
<rect x="516.2" y="52.0" width="377.8" height="101.2" rx="6.0" fill="#edf1f6" stroke="#365378" stroke-width="1.4"/>
<text x="530.2" y="73.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#284163" text-anchor="start">CHILD PARTITION (GUEST VM)</text>
<text x="530.2" y="89.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="start">Guest OS + Enlightenment VSCs</text>
<text x="530.2" y="108.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">Synthetic NIC/Storage VSCs communicate over</text>
<text x="530.2" y="122.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">shared-memory VMBus + SynIC interrupts without hardware</text>
<text x="530.2" y="136.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">emulation</text>
<rect x="26.0" y="211.2" width="868.0" height="73.0" rx="6.0" fill="#f9f1e1" stroke="#b07926" stroke-width="1.4"/>
<text x="460.0" y="232.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#875a14" text-anchor="middle">RING -1 (VMX ROOT / SVM HOST)</text>
<text x="460.0" y="248.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">Microsoft Hypervisor (hvix64.exe / hvax64.exe)</text>
<text x="460.0" y="267.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Minimal ~1.5 MB TCB: owns only vCPU scheduling, SLAT (EPT/NPT) page tables, IOMMU DMA remapping, and hypercalls</text>
<rect x="26.0" y="342.2" width="868.0" height="73.0" rx="6.0" fill="#f4f1ea" stroke="#787167" stroke-width="1.4"/>
<text x="460.0" y="363.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#524c44" text-anchor="middle">SILICON</text>
<text x="460.0" y="379.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">x86-64 / ARM64 CPU + VT-x/AMD-V + SLAT + IOMMU (VT-d / AMD-Vi)</text>
<text x="460.0" y="398.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Hardware enforces memory and DMA isolation between partitions</text>
<text x="460.0" y="441.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Moving device emulation out of Ring -1 into Root Partition VSPs kept hvix64.exe small enough to anchor Virtualization-Based Security.</text>
<line x1="262.1" y1="153.2" x2="262.1" y2="204.7" stroke="#236b66" stroke-width="1.6"/>
<polygon points="262.1,211.2 266.1,202.7 258.1,202.7" fill="#236b66"/>
<line x1="705.1" y1="153.2" x2="705.1" y2="204.7" stroke="#365378" stroke-width="1.6"/>
<polygon points="705.1,211.2 709.1,202.7 701.1,202.7" fill="#365378"/>
<line x1="460.0" y1="284.2" x2="460.0" y2="335.7" stroke="#b07926" stroke-width="1.6"/>
<polygon points="460.0,342.2 464.0,333.7 456.0,333.7" fill="#b07926"/>
<rect x="200.1" y="169.4" width="123.9" height="18.8" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="262.1" y="180.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#236b66" text-anchor="middle">hypercalls (VMCALL)</text>
<rect x="659.3" y="169.4" width="91.5" height="18.8" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="705.1" y="180.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#365378" text-anchor="middle">VMBus / SynIC</text>
<rect x="406.7" y="300.4" width="106.7" height="18.8" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="460.0" y="311.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#b07926" text-anchor="middle">owns VMX / SLAT</text>
</svg>
