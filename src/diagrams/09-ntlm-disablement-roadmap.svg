<text x="164.0" y="235.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">IAKerb, Local KDC, IP-SPN, &amp; Per-Machine Scope Policies</text>
<text x="164.0" y="253.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Closes valid NTLM fallback scenarios and refactors remaining inbox OS</text>
<text x="164.0" y="267.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">NTLM callers to Negotiate</text>
