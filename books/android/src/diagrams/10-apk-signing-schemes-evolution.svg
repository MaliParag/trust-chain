<text x="420.0" y="599.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Modern Android enforces minimum signature scheme floors by targetSdkVersion, rejecting v1-only packages.</text>
