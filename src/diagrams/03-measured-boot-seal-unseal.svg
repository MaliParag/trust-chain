<text x="40.0" y="384.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">bootmgfw caps PCR[11] so post-boot OS cannot re-unseal raw VMK</text>
