<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
<rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
<text x="450.0" y="24.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.0" font-weight="700" letter-spacing="0.90px" fill="#365378" text-anchor="middle">HYPER-V TYPE-1 MICRO-KERNEL PARTITIONING ARCHITECTURE</text>
<rect x="26.0" y="52.0" width="461.1" height="100.6" rx="6.0" fill="#e6f3f1" stroke="#236b66" stroke-width="1.4"/>
<text x="40.0" y="73.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#19524e" text-anchor="start">ROOT PARTITION (HOST OS)</text>
<text x="40.0" y="89.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">Full Windows Kernel + VSPs + vmwp.exe</text>
<text x="40.0" y="107.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">Owns physical drivers, vmswitch.sys, ACPI/PCI, and per-VM worker</text>
<text x="40.0" y="121.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">processes; isolated from hypervisor Ring -1</text>
<rect x="505.1" y="52.0" width="368.9" height="100.6" rx="6.0" fill="#edf1f6" stroke="#365378" stroke-width="1.4"/>
<text x="519.1" y="73.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#284163" text-anchor="start">CHILD PARTITION (GUEST VM)</text>
<text x="519.1" y="89.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">Guest OS + Enlightenment VSCs</text>
<text x="519.1" y="107.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">Synthetic NIC/Storage VSCs communicate over</text>
<text x="519.1" y="121.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">shared-memory VMBus + SynIC interrupts without hardware</text>
<text x="519.1" y="135.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">emulation</text>
<rect x="26.0" y="206.6" width="848.0" height="72.6" rx="6.0" fill="#f9f1e1" stroke="#b07926" stroke-width="1.4"/>
<text x="40.0" y="228.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#875a14" text-anchor="start">RING -1 (VMX ROOT / SVM HOST)</text>
<text x="40.0" y="244.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">Microsoft Hypervisor (hvix64.exe / hvax64.exe)</text>
<text x="40.0" y="262.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">Minimal ~1.5 MB TCB: owns only vCPU scheduling, SLAT (EPT/NPT) page tables, IOMMU DMA remapping, and hypercalls</text>
<rect x="26.0" y="333.2" width="848.0" height="72.6" rx="6.0" fill="#f4f1ea" stroke="#787167" stroke-width="1.4"/>
<text x="40.0" y="354.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#524c44" text-anchor="start">SILICON</text>
<text x="40.0" y="370.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">x86-64 / ARM64 CPU + VT-x/AMD-V + SLAT + IOMMU (VT-d / AMD-Vi)</text>
<text x="40.0" y="388.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">Hardware enforces memory and DMA isolation between partitions</text>
<text x="450.0" y="431.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Moving device emulation out of Ring -1 into Root Partition VSPs kept hvix64.exe small enough to anchor Virtualization-Based Security.</text>
<polyline points="256.6,152.6 256.6,176.1 450.0,176.1 450.0,200.1" fill="none" stroke="#236b66" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="450.0,206.6 453.8,198.6 446.2,198.6" fill="#236b66"/>
<polyline points="689.6,152.6 689.6,179.6 450.0,179.6 450.0,200.1" fill="none" stroke="#365378" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="450.0,206.6 453.8,198.6 446.2,198.6" fill="#365378"/>
<line x1="450.0" y1="279.2" x2="450.0" y2="326.7" stroke="#b07926" stroke-width="1.5"/>
<polygon points="450.0,333.2 453.8,325.2 446.2,325.2" fill="#b07926"/>
<rect x="193.5" y="154.8" width="126.1" height="19.1" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="256.6" y="166.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="400" fill="#236b66" text-anchor="middle">hypercalls (VMCALL)</text>
<rect x="643.0" y="156.6" width="93.1" height="19.1" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="689.6" y="168.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="400" fill="#365378" text-anchor="middle">VMBus / SynIC</text>
<rect x="395.7" y="296.7" width="108.5" height="19.1" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="450.0" y="308.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="400" fill="#b07926" text-anchor="middle">owns VMX / SLAT</text>
</svg>
