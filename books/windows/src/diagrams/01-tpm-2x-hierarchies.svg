<rect x="26.0" y="52.0" width="203.5" height="84.1" rx="6.0" fill="#edf1f6" stroke="#365378" stroke-width="1.4"/>
<text x="40.0" y="73.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#284163" text-anchor="start">PLATFORM (OEM/UEFI)</text>
<text x="40.0" y="88.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Platform Seed (PPS)</text>
<text x="40.0" y="106.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">Controlled by early firmware;</text>
<text x="40.0" y="119.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">survives OS TPM Clear</text>
<rect x="247.5" y="52.0" width="203.5" height="84.1" rx="6.0" fill="#efeaf7" stroke="#5c4282" stroke-width="1.4"/>
<text x="261.5" y="73.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#452e66" text-anchor="start">ENDORSEMENT (IDENTITY)</text>
<text x="261.5" y="88.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Endorsement Seed (EPS)</text>
<text x="261.5" y="106.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">Fused at manufacture; never</text>
<text x="261.5" y="119.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">changes across device life</text>
<rect x="469.0" y="52.0" width="203.5" height="84.1" rx="6.0" fill="#e6f3f1" stroke="#236b66" stroke-width="1.4"/>
<text x="483.0" y="73.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#19524e" text-anchor="start">STORAGE (OS OWNER)</text>
<text x="483.0" y="88.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Storage Seed (SPS)</text>
<text x="483.0" y="106.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">Rotated on TPM2_Clear to wipe</text>
<text x="483.0" y="119.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">OS/user keys cleanly</text>
<rect x="690.5" y="52.0" width="203.5" height="84.1" rx="6.0" fill="#f4f1ea" stroke="#787167" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="704.5" y="73.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#524c44" text-anchor="start">NULL (EPHEMERAL)</text>
<text x="704.5" y="88.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Null Seed</text>
<text x="704.5" y="106.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">Re-randomized on every reboot;</text>
<text x="704.5" y="119.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">zero persistence</text>
<rect x="26.0" y="194.1" width="203.5" height="97.3" rx="6.0" fill="#ffffff" stroke="#8c857b" stroke-width="1.4"/>
<text x="40.0" y="215.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#4a453e" text-anchor="start">FIRMWARE ROOT</text>
<text x="40.0" y="230.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Platform Primary Keys</text>
<text x="40.0" y="248.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">Firmware NVRAM locks &amp;</text>
<text x="40.0" y="261.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">anti-rollback state</text>
<rect x="247.5" y="194.1" width="203.5" height="97.3" rx="6.0" fill="#ffffff" stroke="#8c857b" stroke-width="1.4"/>
<text x="261.5" y="215.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#4a453e" text-anchor="start">TPM2_CREATEPRIMARY</text>
<text x="261.5" y="230.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="start">EK &amp; Restricted AK</text>
<text x="261.5" y="248.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">EK decrypts MakeCredential</text>
<text x="261.5" y="261.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">challenge to certify co-resident</text>
<text x="261.5" y="274.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">AK</text>
<rect x="469.0" y="194.1" width="203.5" height="97.3" rx="6.0" fill="#ffffff" stroke="#8c857b" stroke-width="1.4"/>
<text x="483.0" y="215.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#4a453e" text-anchor="start">TPM2_CREATEPRIMARY</text>
<text x="483.0" y="230.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="start">SRK -&gt; BitLocker &amp; NGC</text>
<text x="483.0" y="248.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">Wraps sealed BitLocker VMK and</text>
<text x="483.0" y="261.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">Windows Hello keys</text>
<rect x="690.5" y="194.1" width="203.5" height="97.3" rx="6.0" fill="#ffffff" stroke="#8c857b" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="704.5" y="215.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#4a453e" text-anchor="start">SESSION ONLY</text>
<text x="704.5" y="230.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Transient Keys</text>
<text x="704.5" y="248.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">Destroyed automatically on</text>
<text x="704.5" y="261.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">power cycle</text>
<text x="460.0" y="317.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Isolating SPS from EPS lets enterprises reset Storage ownership (TPM2_Clear) without destroying hardware Endorsement identity.</text>
