<text x="580.0" y="489.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">against exact {pid, pidversion} audit_token_t</text>
<text x="450.0" y="585.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Never authenticate XPC peers by processIdentifier (pid_t); always bind SecTask / peer signing requirements to audit_token_t.</text>
