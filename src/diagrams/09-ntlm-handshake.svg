<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 561" width="880" height="561">
<rect x="0" y="0" width="880" height="561" fill="#ffffff"/>
<line x1="160.7" y1="106.6" x2="160.7" y2="408.6" stroke="#cbd5e1" stroke-width="1.3"/>
