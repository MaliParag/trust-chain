<text x="460.0" y="515.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Updated independently of vendor firmware while preserving end-to-end cryptographic binding to vbmeta</text>
