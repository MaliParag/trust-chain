<rect x="662.7" y="258.0" width="209.3" height="46.0" rx="0.0" fill="#e6f4ec" stroke="#d4cec3" stroke-width="1.4"/>
<text x="767.3" y="286.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="700" fill="#1e5139" text-anchor="middle">Dedicated guest kernel</text>
<text x="28.0" y="322.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="400" fill="#3a352f" text-anchor="start">Defense-in-depth rule: Untrusted multi-tenant code and autonomous AI sandboxes require gVisor or KVM micro-VM boundaries.</text>
<text x="450.0" y="350.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Both gVisor and Firecracker wrap their host-facing monitor processes inside strict seccomp jails so even VMM bugs stay contained.</text>
