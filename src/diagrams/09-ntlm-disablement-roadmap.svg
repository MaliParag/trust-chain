<text x="164.0" y="368.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Network NTLM Disabled by Default OS-Wide</text>
<text x="164.0" y="387.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Inbound and outbound network NTLM blocked out of the box; binaries</text>
<text x="164.0" y="401.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">remain only for explicit break-glass policy</text>
<text x="380.0" y="442.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Disabling network NTLM shifts 100% of domain authentication onto Kerberos (Chapter 13) and cloud tokens (Chapter 14).</text>
