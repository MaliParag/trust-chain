<text x="704.5" y="195.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Caps + seccomp</text>
<text x="704.5" y="213.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">Drops CAP_SYS_ADMIN &amp; blocks</text>
<text x="704.5" y="226.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">~44 syscalls</text>
<rect x="26.0" y="301.1" width="868.0" height="73.0" rx="6.0" fill="#f8eaec" stroke="#8d2d3b" stroke-width="1.4"/>
<text x="460.0" y="322.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#6e1f2b" text-anchor="middle">SHARED SINGLE POINT OF FAILURE</text>
<text x="460.0" y="338.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">Host Linux Kernel (~300+ Reachable Syscalls, VFS, Netfilter, Slab Heap, and Hardware Drivers)</text>
<text x="460.0" y="357.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">--privileged, host Docker socket mounts, or any Ring 0 memory bug collapses all container boundaries instantly</text>
<text x="460.0" y="400.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Namespaces hide host resources from view; only seccomp, LSMs, and capabilities reduce the reachable host Ring 0 code.</text>
