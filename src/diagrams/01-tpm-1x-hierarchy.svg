<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 542" width="900" height="542">
<rect x="0" y="0" width="900" height="542" fill="#ffffff"/>
<text x="450.0" y="24.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.0" font-weight="700" letter-spacing="0.90px" fill="#365378" text-anchor="middle">TPM 1.2 ARCHITECTURE: SINGLE STORAGE ROOT &amp; PRIVACY-CA INDIRECTION</text>
<rect x="160.0" y="52.0" width="580.0" height="73.3" rx="6.0" fill="#f9f1e1" stroke="#b07926" stroke-width="1.4"/>
<text x="450.0" y="73.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#875a14" text-anchor="middle">SINGLE OWNERSHIP</text>
<text x="450.0" y="89.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Owner Authorization Secret</text>
<text x="450.0" y="108.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="middle">Provisioned once via TPM_TakeOwnership</text>
<rect x="160.0" y="179.3" width="580.0" height="73.3" rx="6.0" fill="#edf1f6" stroke="#365378" stroke-width="1.4"/>
<text x="450.0" y="200.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#284163" text-anchor="middle">SINGLE ROOT</text>
<text x="450.0" y="216.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Storage Root Key (SRK, RSA-2048)</text>
<text x="450.0" y="235.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="middle">Clearing TPM destroys SRK and invalidates every child key</text>
<rect x="26.0" y="290.5" width="270.7" height="72.6" rx="6.0" fill="#ffffff" stroke="#8c857b" stroke-width="1.4"/>
<text x="40.0" y="312.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#4a453e" text-anchor="start">CHILD KEY</text>
<text x="40.0" y="327.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">Storage Key</text>
<text x="40.0" y="346.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">Wraps downstream keys</text>
<rect x="314.7" y="290.5" width="270.7" height="72.6" rx="6.0" fill="#ffffff" stroke="#8c857b" stroke-width="1.4"/>
<text x="328.7" y="312.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#4a453e" text-anchor="start">CHILD KEY</text>
<text x="328.7" y="327.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">Binding / Sealing Key</text>
<text x="328.7" y="346.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">PCR-bound data blobs</text>
<rect x="603.3" y="290.5" width="270.7" height="72.6" rx="6.0" fill="#ffffff" stroke="#8c857b" stroke-width="1.4"/>
<text x="617.3" y="312.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#4a453e" text-anchor="start">CHILD KEY</text>
<text x="617.3" y="327.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">Signing Key</text>
<text x="617.3" y="346.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">Application signatures</text>
<rect x="26.0" y="401.1" width="270.7" height="86.6" rx="6.0" fill="#f9f1e1" stroke="#b07926" stroke-width="1.4"/>
<text x="40.0" y="422.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#875a14" text-anchor="start">HARDWARE IDENTITY</text>
<text x="40.0" y="438.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">Endorsement Key (EK)</text>
<text x="40.0" y="456.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">1 RSA key per chip; decryption-only (cannot</text>
<text x="40.0" y="470.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">sign quotes directly)</text>
<rect x="314.7" y="401.1" width="270.7" height="86.6" rx="6.0" fill="#edf1f6" stroke="#365378" stroke-width="1.4"/>
<text x="328.7" y="422.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#284163" text-anchor="start">EXTERNAL BROKER</text>
<text x="328.7" y="438.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">Privacy CA</text>
<text x="328.7" y="456.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">Verifies EK cert and encrypts AIK</text>
<text x="328.7" y="470.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">credential back to EK</text>
<rect x="603.3" y="401.1" width="270.7" height="86.6" rx="6.0" fill="#efeaf7" stroke="#5c4282" stroke-width="1.4"/>
<text x="617.3" y="422.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#452e66" text-anchor="start">QUOTE SIGNER</text>
<text x="617.3" y="438.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">Attestation Identity Key (AIK)</text>
<text x="617.3" y="456.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">Signs PCR quotes without exposing raw EK</text>
<text x="617.3" y="470.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">modulus</text>
<text x="450.0" y="513.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">TPM 1.2 coupled platform and OS administration under one SRK and fixed algorithms to SHA-1 + RSA-2048.</text>
