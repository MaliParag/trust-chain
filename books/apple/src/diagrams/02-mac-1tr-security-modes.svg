<text x="460.0" y="379.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">SEP-Signed LocalPolicy (IM4M Anchored in OIHR / BAA)</text>
<text x="460.0" y="398.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Records policy flags (sip, ssv, auxkc-hash, custom-kc-hash) scoped solely to one APFS volume group; sibling OS installs stay Full Security</text>
