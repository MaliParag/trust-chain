<text x="483.0" y="365.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="start">TPM Refuses Unseal -&gt; 48-Digit Recovery</text>
