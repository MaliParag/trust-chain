<text x="277.5" y="121.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">App Control for Business (WDAC)</text>
<text x="277.5" y="140.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="middle">Machine-wide, kernel + user mode, signed</text>
<text x="277.5" y="154.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="middle">SiPolicy.p7b + HVCI resists local Admin</text>
<rect x="467.0" y="84.0" width="291.0" height="129.0" rx="6.0" fill="#efeaf7" stroke="#5c4282" stroke-width="1.4" stroke-dasharray="5,3"/>
