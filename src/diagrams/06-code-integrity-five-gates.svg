<text x="50.0" y="630.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Signed Zero-Day BYOVD &amp; Allowed LOLBins</text>
<text x="50.0" y="649.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Validly signed drivers not yet blocklisted or signed tools (msbuild.exe)</text>
