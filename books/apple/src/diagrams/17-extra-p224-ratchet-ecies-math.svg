<text x="460.0" y="234.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#875a14" text-anchor="middle">AUTONOMOUS SYMMETRIC RATCHET &amp; AFFINE SCALAR BLINDING (SECP224R1, 112-BIT SECURITY)</text>
<text x="460.0" y="250.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">SK_i = KDF(SK_{i-1}, 'update'); (u_i, v_i) = KDF(SK_i, 'diversify') -&gt; P_i = u_i*P_0 + v_i*G</text>
<text x="460.0" y="269.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Fits exact 28-byte compressed x(P_i) into 31-byte BLE legacy PDU (6B Random Static MAC + 22B Manufacturer Payload)</text>
