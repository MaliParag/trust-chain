<text x="450.0" y="563.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="middle">forwards all 3 messages across protocols (SMB -&gt; AD CS HTTP ESC8 or LDAP).</text>
<text x="450.0" y="602.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Because the verifier stores unsalted NTOWF = MD4(UTF-16LE(password)), the hash itself is password-equivalent (Pass-the-Hash).</text>
