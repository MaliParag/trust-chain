<text x="460.0" y="351.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">Out-of-Band Fallback Determines Whole-System Security</text>
<text x="460.0" y="370.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">If lost-device recovery falls back to SMS, email, or unverified helpdesk TAP, attackers bypass WebAuthn entirely via the recovery door</text>
