<text x="48.0" y="425.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">HVCI / SKCI (VTL1 W^X &amp; No Unsigned RWX)</text>
<text x="48.0" y="444.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Blocks drivers that allocate RWX pool memory or self-modify code</text>
