<text x="704.5" y="219.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="start">auxp · auxi/aukh · auxr</text>
<text x="704.5" y="237.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">Binds User-Authorized Kext</text>
<text x="704.5" y="250.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">List hash (auxp), SEP-signed</text>
<text x="704.5" y="263.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">AuxKC IM4M hash (auxi/aukh),</text>
<text x="704.5" y="276.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="start">and filtered receipt hash (auxr)</text>
<rect x="26.0" y="351.5" width="868.0" height="73.0" rx="6.0" fill="#f8eaec" stroke="#8d2d3b" stroke-width="1.4"/>
<text x="460.0" y="373.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#6e1f2b" text-anchor="middle">HARDWARE STATE ENFORCEMENT ACROSS LLB, IBOOT, AND SEP SECURE STORAGE COMPONENT</text>
<text x="460.0" y="389.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">SEP Rotates Secret LPN -&gt; lpnh' on Every Policy Mutation &amp; Erases LPN/RPN on Find My Lock</text>
<text x="460.0" y="407.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Backing up an older Permissive LocalPolicy file fails at boot because SHA-384(LPN_current) != lpnh_replayed</text>
<text x="460.0" y="450.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Each APFS volume group maintains an independent LocalPolicy so Permissive Linux never weakens sibling Full Security macOS.</text>
