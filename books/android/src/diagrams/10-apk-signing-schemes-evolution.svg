<rect x="172.0" y="54.0" width="636.0" height="87.5" rx="6.0" fill="#f8eaec" stroke="#8d2d3b" stroke-width="1.4"/>
<text x="186.0" y="75.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#6e1f2b" text-anchor="start">META-INF/MANIFEST.MF (JAR SIGNING)</text>
<text x="186.0" y="91.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Per-Entry ZIP Signatures Leave Archive Framing Unsigned</text>
<text x="186.0" y="110.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">ZIP parser reads from EOF Central Directory while ART DEX loader read from offset 0 -&gt; Janus</text>
<text x="186.0" y="124.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">(CVE-2017-13156) prepended malicious DEX without invalidating v1</text>
<rect x="172.0" y="159.5" width="636.0" height="87.5" rx="6.0" fill="#e6f3f1" stroke="#236b66" stroke-width="1.4"/>
<text x="186.0" y="181.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#19524e" text-anchor="start">ANDROID 7.0 · APK SIGNING BLOCK</text>
<text x="186.0" y="197.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Whole-File Merkle Signature Covering Every Byte Outside Signing Block</text>
<text x="186.0" y="215.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Inserts length-prefixed block immediately before ZIP Central Directory; hashes 1 MiB chunks across</text>
<text x="186.0" y="229.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">sections 1, 3, and 4 to eliminate Janus framing gaps</text>
<rect x="172.0" y="265.0" width="636.0" height="87.5" rx="6.0" fill="#e6f4ec" stroke="#2b6a4c" stroke-width="1.4"/>
<text x="186.0" y="286.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#1e5139" text-anchor="start">ANDROID 9.0 · SIGNINGCERTIFICATELINEAGE</text>
<text x="186.0" y="302.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Cryptographic Key Rotation Without Changing Package Identity</text>
<text x="186.0" y="321.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Old signing key signs rotation proof delegating update/sharedUserId capabilities to new key while</text>
<text x="186.0" y="335.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">bounding legacy key permissions</text>
<rect x="172.0" y="370.5" width="636.0" height="87.5" rx="6.0" fill="#efeaf7" stroke="#5c4282" stroke-width="1.4"/>
<text x="186.0" y="392.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#452e66" text-anchor="start">ANDROID 11 · FS-VERITY STREAMING</text>
<text x="186.0" y="408.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">4 KiB Page-Granular fs-verity Merkle Tree (.idsig)</text>
<text x="186.0" y="426.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Enables Incremental File System instant launch while kernel fs-verity verifies every paged-in APK block</text>
<text x="186.0" y="441.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">on demand</text>
<rect x="172.0" y="476.0" width="636.0" height="87.5" rx="6.0" fill="#f9f1e1" stroke="#b07926" stroke-width="1.4"/>
<text x="186.0" y="497.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#875a14" text-anchor="start">CERTIFIED ANDROID DEVICES · ECOSYSTEM ACCOUNTABILITY</text>
<text x="186.0" y="513.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Android Developer Verification Across Play &amp; Sideloading</text>
<text x="186.0" y="532.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Binds package names and signing keys of sideloaded APKs on certified devices to verified developer</text>
<text x="186.0" y="546.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">identities to curb repeat banking-trojan re-signing</text>
<text x="118.0" y="101.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="700" fill="#8d2d3b" text-anchor="end">2008 · v1</text>
<text x="118.0" y="207.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="700" fill="#236b66" text-anchor="end">2016 · v2</text>
<text x="118.0" y="312.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="700" fill="#2b6a4c" text-anchor="end">2018 · v3</text>
<text x="118.0" y="418.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="700" fill="#5c4282" text-anchor="end">2020 · v4</text>
