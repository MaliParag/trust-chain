<text x="136" y="162" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="600" letter-spacing="1.5px" fill="#d4a843" text-anchor="start">THE WINDOWS TRUST CHAIN  ·  ARCHITECTURAL OVERVIEW</text>
<line x1="136" y1="184" x2="1264" y2="184" stroke="#233248" stroke-width="1.2"/>
<text x="136" y="248" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="34" font-weight="700" fill="#f7f4ed" text-anchor="start">In modern Windows, no layer can assert its own trustworthiness.</text>
<text x="136" y="294" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="31" font-weight="400" font-style="italic" fill="#d4a843" text-anchor="start">Every security invariant is inherited from silicon or lost at the seam.</text>
<text x="136" y="364" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.5" font-weight="400" fill="#d0d9e6" text-anchor="start">Modern Windows is defended not by isolated features, but by a directed chain of</text>
<text x="136" y="398" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.5" font-weight="400" fill="#d0d9e6" text-anchor="start">cryptographic and hardware invariants: fused silicon roots verify UEFI firmware before the</text>
<text x="136" y="432" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.5" font-weight="400" fill="#d0d9e6" text-anchor="start">OS loader runs, TPM 2.0 and Microsoft Pluton bind Measured Boot state into PCR banks,</text>
<text x="136" y="466" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.5" font-weight="400" fill="#d0d9e6" text-anchor="start">Hyper-V SLAT partitions physical memory into VTL0 and VTL1, kernel code integrity and access</text>
<text x="136" y="500" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.5" font-weight="400" fill="#d0d9e6" text-anchor="start">tokens constrain execution, Kerberos tickets and WebAuthn passkeys authenticate identity,</text>
<text x="136" y="534" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.5" font-weight="400" fill="#d0d9e6" text-anchor="start">ETW records kernel telemetry, and cloud policy engines continuously evaluate risk.</text>
<text x="136" y="586" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.5" font-weight="400" fill="#d0d9e6" text-anchor="start">Across twenty-three chapters grounded in 912 primary-source specifications, RFCs, research</text>
<text x="136" y="620" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.5" font-weight="400" fill="#d0d9e6" text-anchor="start">papers, and incident reports, this book pairs the exact mechanism of each link with the</text>
<text x="136" y="654" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.5" font-weight="400" fill="#d0d9e6" text-anchor="start">adversarial techniques (BlackLotus, Bitpixie, BYOVD, Potato escalation, BadSuccessor, Golden</text>
<text x="136" y="688" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.5" font-weight="400" fill="#d0d9e6" text-anchor="start">Ticket, Pass-the-PRT, EchoLeak, and Storm-0558) that break the chain whenever a higher tier</text>
<text x="136" y="722" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.5" font-weight="400" fill="#d0d9e6" text-anchor="start">mistakes cryptographic validity for authorization.</text>
<text x="136" y="790" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.4px" fill="#d4a843" text-anchor="start">ARCHITECTURE OF THE TWENTY-THREE-CHAPTER EDITION</text>
<rect x="136" y="810" width="1128" height="86" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="810" width="5" height="86" rx="2" fill="#d4a843"/>
<text x="160" y="843" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#d4a843" text-anchor="start">PART I · SILICON</text>
<text x="160" y="870" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapters 1 to 5</text>
<text x="434" y="847" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.6" font-weight="400" fill="#eef2f7" text-anchor="start">UEFI Secure Boot, TPM 1.2 to 2.0, Microsoft Pluton, Measured Boot PCRs,</text>
<text x="434" y="871" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.6" font-weight="400" fill="#eef2f7" text-anchor="start">and Remote Attestation</text>
<rect x="136" y="906" width="1128" height="86" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="906" width="5" height="86" rx="2" fill="#d4a843"/>
<text x="160" y="939" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#d4a843" text-anchor="start">PART II · KERNEL &amp; CODE</text>
<text x="160" y="966" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapters 6 to 9</text>
<text x="434" y="943" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.6" font-weight="400" fill="#eef2f7" text-anchor="start">Hyper-V VBS &amp; VTL1 Trustlets, Authenticode, HVCI, App Control (WDAC), PPL,</text>
<text x="434" y="967" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.6" font-weight="400" fill="#eef2f7" text-anchor="start">ACG, CFG/XFG, and CET</text>
<rect x="136" y="1002" width="1128" height="86" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="1002" width="5" height="86" rx="2" fill="#d4a843"/>
<text x="160" y="1035" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#d4a843" text-anchor="start">PART III · CREDENTIALS</text>
<text x="160" y="1062" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapters 10 to 17</text>
<text x="434" y="1039" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.6" font-weight="400" fill="#eef2f7" text-anchor="start">Tokens &amp; MIC, BitLocker &amp; DPAPI, Cred Guard, NTLM, Kerberos, AD CS &amp; dMSA,</text>
<text x="434" y="1063" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.6" font-weight="400" fill="#eef2f7" text-anchor="start">PRTs, and Passkeys</text>
<rect x="136" y="1098" width="1128" height="86" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="1098" width="5" height="86" rx="2" fill="#7ea6d8"/>
<text x="160" y="1131" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#7ea6d8" text-anchor="start">INTERLUDE · TELEMETRY</text>
<text x="160" y="1158" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapter 18</text>
<text x="434" y="1135" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.6" font-weight="400" fill="#eef2f7" text-anchor="start">ETW Lock-Free Ring Buffers, EtwTi, Windows Resiliency Initiative, and</text>
<text x="434" y="1159" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.6" font-weight="400" fill="#eef2f7" text-anchor="start">Antimalware-PPL Gates</text>
<rect x="136" y="1194" width="1128" height="86" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="1194" width="5" height="86" rx="2" fill="#d4a843"/>
<text x="160" y="1227" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#d4a843" text-anchor="start">PART IV · CLOUD &amp; AI</text>
<text x="160" y="1254" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapters 19 to 22</text>
<text x="434" y="1231" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.6" font-weight="400" fill="#eef2f7" text-anchor="start">NIST SP 800-207 Conditional Access, CAE, Windows Agent Workspace &amp; Entra</text>
<text x="434" y="1255" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.6" font-weight="400" fill="#eef2f7" text-anchor="start">Agent ID, and CVMs</text>
<rect x="136" y="1290" width="1128" height="86" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="1290" width="5" height="86" rx="2" fill="#df5a67"/>
<text x="160" y="1323" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#df5a67" text-anchor="start">FINALE · THE SNAP</text>
<text x="160" y="1350" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapter 23</text>
<text x="434" y="1327" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.6" font-weight="400" fill="#eef2f7" text-anchor="start">Storm-0558, Stolen 2016 MSA Key, CVE-2025-55241 Actor Tokens, and July</text>
<text x="434" y="1351" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.6" font-weight="400" fill="#eef2f7" text-anchor="start">2026 SFI Completion</text>
<rect x="136.0" y="1404" width="364.0" height="106" rx="6" fill="#0a1220" stroke="#2a3c57" stroke-width="1.1"/>
<text x="156.0" y="1438" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14" font-weight="700" letter-spacing="1.0px" fill="#d4a843" text-anchor="start">912 PRIMARY SOURCES</text>
<text x="156.0" y="1466" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="16.5" font-weight="400" fill="#b8c5d6" text-anchor="start">Normative TCG, UEFI, Intel, AMD, IETF,</text>
<text x="156.0" y="1488" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="16.5" font-weight="400" fill="#b8c5d6" text-anchor="start">NIST, and [MS-*] protocol specs</text>
<rect x="518.0" y="1404" width="364.0" height="106" rx="6" fill="#0a1220" stroke="#2a3c57" stroke-width="1.1"/>
<text x="538.0" y="1438" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14" font-weight="700" letter-spacing="1.0px" fill="#d4a843" text-anchor="start">UNIFORM RIGOR</text>
<text x="538.0" y="1466" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="16.5" font-weight="400" fill="#b8c5d6" text-anchor="start">Formal invariants, 6-column attack</text>
<text x="538.0" y="1488" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="16.5" font-weight="400" fill="#b8c5d6" text-anchor="start">catalogs, and theoretical limits</text>
<rect x="900.0" y="1404" width="364.0" height="106" rx="6" fill="#0a1220" stroke="#2a3c57" stroke-width="1.1"/>
<text x="920.0" y="1438" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14" font-weight="700" letter-spacing="1.0px" fill="#d4a843" text-anchor="start">LIVE VERIFICATION</text>
<text x="920.0" y="1466" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="16.5" font-weight="400" fill="#b8c5d6" text-anchor="start">Non-destructive PowerShell, bcdedit,</text>
<text x="920.0" y="1488" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="16.5" font-weight="400" fill="#b8c5d6" text-anchor="start">wevtutil, and registry audits</text>
<line x1="136" y1="1648" x2="1264" y2="1648" stroke="#233248" stroke-width="1.2"/>
<text x="136" y="1696" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="30" font-weight="700" fill="#f7f4ed" text-anchor="start">Parag Mali</text>
<text x="136" y="1728" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="15.5" font-weight="400" fill="#8cb0db" text-anchor="start">The Platform Trust Chain Series</text>
<rect x="846" y="1668" width="418" height="72" rx="5" fill="#0d1728" stroke="#d4a843" stroke-width="1.1" stroke-opacity="0.55"/>
