<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 673" width="760" height="673">
<rect x="0" y="0" width="760" height="673" fill="#ffffff"/>
<text x="380.0" y="24.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.0" font-weight="700" letter-spacing="0.90px" fill="#365378" text-anchor="middle">DEFENSE-IN-DEPTH SERVICE CONFINEMENT IN SYSTEMD.EXEC(5)</text>
<rect x="145.0" y="48.0" width="470.0" height="87.5" rx="6.0" fill="#edf1f6" stroke="#365378" stroke-width="1.4"/>
<text x="159.0" y="69.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#284163" text-anchor="start">LAYER 1 · EPHEMERAL IDENTITY</text>
<text x="159.0" y="85.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">DynamicUser=yes + User=/Group= + CapabilityBoundingSet=</text>
<text x="159.0" y="104.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Allocates transient UID from 61184..65519 for unit lifetime; revokes SUID</text>
<text x="159.0" y="118.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">creation via NoNewPrivileges=yes</text>
<rect x="145.0" y="193.5" width="470.0" height="103.5" rx="6.0" fill="#e6f3f1" stroke="#236b66" stroke-width="1.4"/>
<text x="159.0" y="215.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#19524e" text-anchor="start">LAYER 2 · VFS MOUNT NAMESPACE</text>
<text x="159.0" y="231.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">ProtectSystem=strict + ProtectHome=yes + PrivateTmp=yes</text>
<text x="159.0" y="247.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">+ PrivateDevices=yes</text>
<text x="159.0" y="265.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Mounts entire OS tree read-only inside private CLONE_NEWNS, hides /home,</text>
<text x="159.0" y="279.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">and replaces /dev with safe pseudo-devices</text>
<rect x="145.0" y="355.0" width="470.0" height="103.5" rx="6.0" fill="#efeaf7" stroke="#5c4282" stroke-width="1.4"/>
<text x="159.0" y="376.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#452e66" text-anchor="start">LAYER 3 · KERNEL ATTACK-SURFACE LOCKS</text>
<text x="159.0" y="392.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">ProtectKernelTunables=yes + ProtectKernelModules=yes +</text>
<text x="159.0" y="408.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">RestrictNamespaces=yes</text>
<text x="159.0" y="427.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Locks /proc/sys and /sys read-only, denies module loading, and blocks</text>
<text x="159.0" y="441.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">CLONE_NEWUSER exploitation</text>
<rect x="145.0" y="516.5" width="470.0" height="103.5" rx="6.0" fill="#e6f4ec" stroke="#2b6a4c" stroke-width="1.4"/>
<text x="159.0" y="538.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#1e5139" text-anchor="start">LAYER 4 · SYSCALL &amp; NETWORK FILTER</text>
<text x="159.0" y="554.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">SystemCallFilter=@system-service +</text>
<text x="159.0" y="570.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">SystemCallArchitectures=native + RestrictAddressFamilies=</text>
<text x="159.0" y="588.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Installs seccomp-BPF allowlist, blocks 32-bit IA32 compat syscalls, and</text>
<text x="159.0" y="603.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">confines socket families (AF_UNIX / AF_INET)</text>
<text x="380.0" y="644.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Declarative systemd unit directives turn every daemon into a bespoke mini-container audited via 'systemd-analyze security'.</text>
<line x1="380.0" y1="135.5" x2="380.0" y2="187.0" stroke="#4a5568" stroke-width="1.5"/>
<polygon points="380.0,193.5 384.0,185.0 376.0,185.0" fill="#4a5568"/>
<line x1="380.0" y1="297.0" x2="380.0" y2="348.5" stroke="#4a5568" stroke-width="1.5"/>
<polygon points="380.0,355.0 384.0,346.5 376.0,346.5" fill="#4a5568"/>
<line x1="380.0" y1="458.5" x2="380.0" y2="510.0" stroke="#4a5568" stroke-width="1.5"/>
<polygon points="380.0,516.5 384.0,508.0 376.0,508.0" fill="#4a5568"/>
<rect x="308.6" y="151.6" width="142.7" height="18.8" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="380.0" y="163.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#4a5568" text-anchor="middle">per-service mount table</text>
<rect x="320.6" y="313.1" width="118.8" height="18.8" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="380.0" y="324.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#4a5568" text-anchor="middle">blocks Ring 0 pivots</text>
<rect x="313.5" y="474.7" width="132.9" height="18.8" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="380.0" y="486.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#4a5568" text-anchor="middle">seccomp + socket gate</text>
</svg>
