<line x1="719.3" y1="106.6" x2="719.3" y2="408.6" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="440.0" y="24.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.0" font-weight="700" letter-spacing="0.90px" fill="#365378" text-anchor="middle">THREE-MESSAGE NTLMV2 WIRE HANDSHAKE &amp; RELAY EXPOSURE</text>
<rect x="34.0" y="50.0" width="253.3" height="56.6" rx="6.0" fill="#edf1f6" stroke="#365378" stroke-width="1.4"/>
<text x="160.7" y="72.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.0" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client</text>
<text x="160.7" y="89.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="middle">Holds NTOWF(password)</text>
<rect x="313.3" y="50.0" width="253.3" height="56.6" rx="6.0" fill="#e6f3f1" stroke="#236b66" stroke-width="1.4"/>
<text x="440.0" y="72.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.0" font-weight="700" fill="#1a1a1a" text-anchor="middle">Application Server</text>
<text x="440.0" y="89.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="middle">SMB / HTTP / LDAP</text>
<rect x="592.7" y="50.0" width="253.3" height="56.6" rx="6.0" fill="#e6f4ec" stroke="#2b6a4c" stroke-width="1.4"/>
<text x="719.3" y="72.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.0" font-weight="700" fill="#1a1a1a" text-anchor="middle">Domain Controller</text>
<text x="719.3" y="89.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#433e38" text-anchor="middle">Netlogon Verify</text>
<rect x="70.0" y="422.6" width="740.0" height="87.5" rx="6.0" fill="#f8eaec" stroke="#8d2d3b" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="440.0" y="444.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#6e1f2b" text-anchor="middle">STRUCTURAL RELAY FLAW</text>
<text x="440.0" y="460.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Unbound Challenge-Response Without Mandatory Signing + Channel Binding (EPA)</text>
<text x="440.0" y="478.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="middle">Unless SMB/LDAP Signing and TLS Channel Binding Tokens (MsvAvChannelBindings) are enforced on the target, an attacker</text>
<text x="440.0" y="493.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="middle">forwards all 3 messages across protocols (SMB -&gt; AD CS HTTP ESC8 or LDAP).</text>
<text x="440.0" y="532.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Because the verifier stores unsalted NTOWF = MD4(UTF-16LE(password)), the hash itself is password-equivalent (Pass-the-Hash).</text>
<line x1="160.7" y1="140.6" x2="433.5" y2="140.6" stroke="#365378" stroke-width="1.6"/>
<polygon points="440.0,140.6 432.0,136.8 432.0,144.4" fill="#365378"/>
<line x1="440.0" y1="178.6" x2="167.2" y2="178.6" stroke="#236b66" stroke-width="1.6"/>
<polygon points="160.7,178.6 168.7,182.4 168.7,174.8" fill="#236b66"/>
<line x1="160.7" y1="284.6" x2="433.5" y2="284.6" stroke="#365378" stroke-width="1.6"/>
<polygon points="440.0,284.6 432.0,280.8 432.0,288.4" fill="#365378"/>
<line x1="440.0" y1="322.6" x2="712.8" y2="322.6" stroke="#236b66" stroke-width="1.6"/>
<polygon points="719.3,322.6 711.3,318.8 711.3,326.4" fill="#236b66"/>
<line x1="719.3" y1="360.6" x2="446.5" y2="360.6" stroke="#2b6a4c" stroke-width="1.6"/>
<polygon points="440.0,360.6 448.0,364.4 448.0,356.8" fill="#2b6a4c"/>
<rect x="146.0" y="118.2" width="308.6" height="18.8" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="300.3" y="129.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#1a1a1a" text-anchor="middle">1 · NEGOTIATE_MESSAGE (capability flags; no identity)</text>
<rect x="91.0" y="156.2" width="418.7" height="18.8" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="300.3" y="167.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#1a1a1a" text-anchor="middle">2 · CHALLENGE_MESSAGE (8-byte ServerChallenge + TargetInfo AV_PAIRs)</text>
<rect x="59.6" y="194.0" width="202.0" height="45.2" rx="4" fill="#f4f1ea" stroke="#b07926" stroke-width="0.9"/>
<text x="160.7" y="205.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="400" fill="#b07926" text-anchor="middle">3 · NTOWFv2 = HMAC_MD5(NTOWF,</text>
<text x="160.7" y="218.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="400" fill="#b07926" text-anchor="middle">Upper(User)||Domain); compute</text>
<text x="160.7" y="231.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="400" fill="#b07926" text-anchor="middle">NTProofStr</text>
<rect x="83.9" y="262.2" width="432.9" height="18.8" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="300.3" y="273.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#1a1a1a" text-anchor="middle">4 · AUTHENTICATE_MESSAGE (NTProofStr + optional MIC + optional EPA CBT)</text>
<rect x="437.9" y="300.2" width="283.5" height="18.8" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="579.7" y="311.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#1a1a1a" text-anchor="middle">5 · NetrLogonSamLogonEx pass-through validation</text>
<rect x="380.9" y="338.2" width="397.6" height="18.8" rx="4" fill="#ffffff" stroke="#dcd6cc" stroke-width="0.9"/>
<text x="579.7" y="349.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.0" font-weight="400" fill="#1a1a1a" text-anchor="middle">6 · Recompute HMAC from AD NTOWF -&gt; STATUS_SUCCESS + user SIDs</text>
</svg>
