<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 251" width="900" height="251">
<rect x="0" y="0" width="900" height="251" fill="#ffffff"/>
<text x="450.0" y="24.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.0" font-weight="700" letter-spacing="0.90px" fill="#365378" text-anchor="middle">PHYSICAL BUS &amp; PACKAGING EVOLUTION: DTPM VS. FTPM VS. MICROSOFT PLUTON</text>
<rect x="26.0" y="52.0" width="270.7" height="144.2" rx="6.0" fill="#f8eaec" stroke="#8d2d3b" stroke-width="1.4"/>
<text x="40.0" y="73.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#6e1f2b" text-anchor="start">1 · DISCRETE DTPM</text>
<text x="40.0" y="89.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">External Microcontroller on</text>
<text x="40.0" y="105.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">Motherboard</text>
<text x="40.0" y="123.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">CPU &lt;-&gt; Chipset &lt;-&gt; Exposed SPI / LPC</text>
<text x="40.0" y="137.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">traces -&gt; Discrete TPM IC.</text>
<text x="40.0" y="151.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">Vulnerability: Passive $40 logic analyzer</text>
<text x="40.0" y="165.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">sniffs unencrypted TPM2_Unseal</text>
<text x="40.0" y="179.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">responses on board pins.</text>
<rect x="314.7" y="52.0" width="270.7" height="144.2" rx="6.0" fill="#f9f1e1" stroke="#b07926" stroke-width="1.4"/>
<text x="328.7" y="73.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#875a14" text-anchor="start">2 · FIRMWARE FTPM (PTT / PSP)</text>
<text x="328.7" y="89.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">Chipset / SoC Management Enclave</text>
<text x="328.7" y="107.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">No external SPI/LPC wires to TPM, but</text>
<text x="328.7" y="121.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">firmware updates depend on fragmented</text>
<text x="328.7" y="135.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">OEM UEFI capsule delivery.</text>
<rect x="603.3" y="52.0" width="270.7" height="144.2" rx="6.0" fill="#e6f4ec" stroke="#2b6a4c" stroke-width="1.4"/>
<text x="617.3" y="73.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#1e5139" text-anchor="start">3 · ON-DIE MICROSOFT PLUTON</text>
<text x="617.3" y="89.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">Dedicated Security Core Inside</text>
<text x="617.3" y="105.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.2" font-weight="700" fill="#1a1a1a" text-anchor="start">CPU Die</text>
<text x="617.3" y="123.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">Communicates over internal SoC</text>
<text x="617.3" y="137.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">interconnect via CRB; SHACK keeps raw</text>
<text x="617.3" y="151.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">keys out of firmware SRAM; serviced</text>
<text x="617.3" y="165.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.6" font-weight="400" fill="#433e38" text-anchor="start">directly via Windows Update.</text>
<text x="450.0" y="222.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Pluton closes passive motherboard bus sniffing by collapsing the CPU-to-TPM wire inside the silicon package.</text>
</svg>
