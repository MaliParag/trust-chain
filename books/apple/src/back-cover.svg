<text x="136" y="162" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="600" letter-spacing="1.5px" fill="#7cc4f8" text-anchor="start">THE APPLE TRUST CHAIN  ·  ARCHITECTURAL BLUEPRINT</text>
<line x1="136" y1="184" x2="1264" y2="184" stroke="#233248" stroke-width="1.2"/>
<text x="136" y="248" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="32" font-weight="700" fill="#f7f4ed" text-anchor="start">One silicon architecture across five operating systems.</text>
<text x="136" y="294" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="28" font-weight="400" font-style="italic" fill="#7cc4f8" text-anchor="start">Every guarantee is personalized in hardware or intentionally relaxed by owner policy.</text>
<text x="136" y="364" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">Since the transition to Apple Silicon, iOS, iPadOS, macOS, watchOS, and visionOS share one</text>
<text x="136" y="398" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">vertical chain of cryptographic invariants: immutable Boot ROM and per-device Image4 tickets</text>
<text x="136" y="432" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">verify boot stages, the Secure Enclave Processor (SEP) isolates biometric and key material</text>
<text x="136" y="466" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">behind UID fuses, SPTM and Pointer Authentication harden XNU memory, Signed System Volumes</text>
<text x="136" y="500" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">seal the OS, and Private Cloud Compute extends attestation to cloud AI.</text>
<text x="136" y="552" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">Rather than treating Apple's platforms as disconnected products, this volume traces their</text>
<text x="136" y="586" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">shared Darwin spine once and highlights the exact forks where threat models diverge: closed</text>
<text x="136" y="620" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">iPhone TXM enforcement versus macOS 1TR LocalPolicy and Notarization, visionOS R1 spatial</text>
<text x="136" y="654" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">sensor isolation, and mercenary zero-click exploit chains.</text>
<text x="136" y="722" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.4px" fill="#7cc4f8" text-anchor="start">PLANNED ARCHITECTURE OF THIS VOLUME</text>
<rect x="136" y="742" width="1128" height="92" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="742" width="5" height="92" rx="2" fill="#7cc4f8"/>
<text x="160" y="777" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#7cc4f8" text-anchor="start">PART I · SILICON</text>
<text x="160" y="804" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapters 1 to 4</text>
<text x="434" y="781" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">Boot ROM, Image4/TSS personalization, macOS 1TR LocalPolicy, SEP/sepOS,</text>
<text x="434" y="806" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">PAC, SPTM, and EMTE</text>
<rect x="136" y="846" width="1128" height="92" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="846" width="5" height="92" rx="2" fill="#7cc4f8"/>
<text x="160" y="881" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#7cc4f8" text-anchor="start">PART II · XNU &amp; CODE</text>
<text x="160" y="908" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapters 5 to 8</text>
<text x="434" y="885" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">APFS Signed System Volume, AMFI, TXM vs. Gatekeeper/Notarization,</text>
<text x="434" y="910" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">Seatbelt, BlastDoor, TCC, and ESF</text>
<rect x="136" y="950" width="1128" height="92" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="950" width="5" height="92" rx="2" fill="#7cc4f8"/>
<text x="160" y="985" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#7cc4f8" text-anchor="start">PART III · DATA &amp; KEYS</text>
<text x="160" y="1012" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapters 9 to 12</text>
<text x="434" y="989" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">APFS per-file Data Protection, BFU/AFU forensics, Stolen Device</text>
<text x="434" y="1014" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">Protection, Passkeys, and DDM</text>
<rect x="136" y="1054" width="1128" height="92" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="1054" width="5" height="92" rx="2" fill="#7cc4f8"/>
<text x="160" y="1089" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#7cc4f8" text-anchor="start">PART IV · CLOUD &amp; PCC</text>
<text x="160" y="1116" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapters 13 to 16</text>
<text x="434" y="1093" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">iCloud HSM recovery, Advanced Data Protection, iMessage PQ3 + KT, Find My,</text>
<text x="434" y="1118" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">and Private Cloud Compute</text>
<rect x="136" y="1158" width="1128" height="92" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="1158" width="5" height="92" rx="2" fill="#df5a67"/>
<text x="160" y="1193" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#df5a67" text-anchor="start">FINALE · THE SEAMS</text>
<text x="160" y="1220" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapter 17</text>
<text x="434" y="1197" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">FORCEDENTRY, Operation Triangulation MMIO, macOS TCC bypasses, and</text>
<text x="434" y="1222" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">sovereign ADP compulsion</text>
