<text x="460.0" y="384.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Prevents partition-swap attacks across A/B slots and binds mounted volume identity into TPM 2.0 PCR[15]</text>
