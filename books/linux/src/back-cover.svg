  <rect x="56" y="56" width="1288" height="1738" fill="none" stroke="#223046" stroke-width="1.5"/>
  <rect x="68" y="68" width="1264" height="1714" fill="none" stroke="#e5954b" stroke-width="0.8" stroke-opacity="0.30"/>
  <path d="M 56 96 L 56 56 L 96 56 M 1304 56 L 1344 56 L 1344 96 M 56 1754 L 56 1794 L 96 1794 M 1304 1794 L 1344 1794 L 1344 1754"
        fill="none" stroke="#e5954b" stroke-width="2.0" stroke-opacity="0.75"/>

<text x="136" y="162" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="15" font-weight="600" letter-spacing="1.5px" fill="#e5954b" text-anchor="start">THE LINUX TRUST CHAIN  ·  ARCHITECTURAL BLUEPRINT</text>
<line x1="136" y1="184" x2="1264" y2="184" stroke="#233248" stroke-width="1.2"/>
<text x="136" y="248" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="32" font-weight="700" fill="#f7f4ed" text-anchor="start">On Linux, trust is assembled from composable mechanisms rather than dictated by one vendor.</text>
<text x="136" y="294" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="28" font-weight="400" font-style="italic" fill="#e5954b" text-anchor="start">Every unsealed seam between bootloader, initramfs, and userspace breaks the chain.</text>
<text x="136" y="364" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">Unlike vertically integrated proprietary platforms, Linux must span laptops, immutable</text>
<text x="136" y="398" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">appliances, hyperscale Kubernetes nodes, and confidential cloud guests. Closing the classic</text>
<text x="136" y="432" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">gap between a signed kernel and an unverified initramfs required engineering shim/SBAT,</text>
<text x="136" y="466" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">signed Unified Kernel Images (UKIs), systemd-cryptsetup TPM2 sealing, dm-verity/fs-verity</text>
<text x="136" y="500" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">Merkle roots, and Linux Security Modules.</text>
<text x="136" y="552" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">This volume traces how modern Linux composes those primitives from reset vector to</text>
<text x="136" y="586" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">multi-tenant cloud workloads, analyzing where container namespaces share a monolithic kernel</text>
<text x="136" y="620" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">TCB, how the eBPF verifier serves simultaneously as observability engine and attack surface,</text>
<text x="136" y="654" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="22.0" font-weight="400" fill="#d0d9e6" text-anchor="start">and how supply-chain attacks such as XZ Utils target userspace trust.</text>
<text x="136" y="722" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.4px" fill="#e5954b" text-anchor="start">PLANNED ARCHITECTURE OF THIS VOLUME</text>
<rect x="136" y="742" width="1128" height="92" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="742" width="5" height="92" rx="2" fill="#e5954b"/>
<text x="160" y="777" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#e5954b" text-anchor="start">PART I · VERIFIED BOOT</text>
<text x="160" y="804" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapters 1 to 4</text>
<text x="434" y="781" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">UEFI shim, MOK, SBAT, Unified Kernel Images, systemd-stub TPM2 PCRs,</text>
<text x="434" y="806" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">LUKS2, dm-verity, and IMA</text>
<rect x="136" y="846" width="1128" height="92" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="846" width="5" height="92" rx="2" fill="#e5954b"/>
<text x="160" y="881" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#e5954b" text-anchor="start">PART II · KERNEL &amp; LSMs</text>
<text x="160" y="908" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapters 5 to 8</text>
<text x="434" y="885" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">Kernel Lockdown, module signatures, CFI/KFENCE, SELinux, AppArmor,</text>
<text x="434" y="910" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">Landlock, and the eBPF verifier</text>
<rect x="136" y="950" width="1128" height="92" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="950" width="5" height="92" rx="2" fill="#e5954b"/>
<text x="160" y="985" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#e5954b" text-anchor="start">PART III · USERSPACE AUTH</text>
<text x="160" y="1012" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapters 9 to 12</text>
<text x="434" y="989" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">POSIX capabilities, user namespaces, Polkit/sudo, kernel keyrings, PAM,</text>
<text x="434" y="1014" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">SSH certificates, and FIDO2</text>
<rect x="136" y="1054" width="1128" height="92" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="1054" width="5" height="92" rx="2" fill="#e5954b"/>
<text x="160" y="1089" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#e5954b" text-anchor="start">PART IV · CLOUD NATIVE</text>
<text x="160" y="1116" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapters 13 to 15</text>
<text x="434" y="1093" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">cgroups/seccomp-BPF containers, gVisor/Firecracker/Kata microVMs,</text>
<text x="434" y="1118" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">SPIFFE/SPIRE, and COCONUT-SVSM</text>
<rect x="136" y="1158" width="1128" height="92" rx="6" fill="#0d1728" stroke="#22324a" stroke-width="1.2"/>
<rect x="136" y="1158" width="5" height="92" rx="2" fill="#df5a67"/>
<text x="160" y="1193" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="14.5" font-weight="700" letter-spacing="1.0px" fill="#df5a67" text-anchor="start">FINALE · THE SEAMS</text>
<text x="160" y="1220" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="13.5" font-weight="400" fill="#8ea2bd" text-anchor="start">Chapter 16</text>
<text x="434" y="1197" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">XZ Utils (CVE-2024-3094), unmeasured initramfs shells, Dirty Pipe/io_uring</text>
<text x="434" y="1222" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="17.4" font-weight="400" fill="#eef2f7" text-anchor="start">escapes, and distro drift</text>
<line x1="136" y1="1648" x2="1264" y2="1648" stroke="#233248" stroke-width="1.2"/>
<text x="136" y="1696" font-family='Georgia, Baskerville, "Times New Roman", serif' font-size="30" font-weight="700" fill="#f7f4ed" text-anchor="start">Parag Mali</text>
<text x="136" y="1728" font-family='ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace' font-size="15.5" font-weight="400" fill="#8cb0db" text-anchor="start">The Platform Trust Chain Series</text>
<rect x="846" y="1668" width="418" height="72" rx="5" fill="#0d1728" stroke="#e5954b" stroke-width="1.1" stroke-opacity="0.55"/>
<text x="1055.0" y="1698" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="13.5" font-weight="700" letter-spacing="1.1px" fill="#e5954b" text-anchor="middle">OPEN TECHNICAL SERIES  ·  2026</text>
<text x="1055.0" y="1721" font-family='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif' font-size="11.8" font-weight="500" letter-spacing="0.8px" fill="#9fb0c7" text-anchor="middle">CC BY-NC-SA 4.0  ·  SYSTEMS SECURITY</text>
</svg>
