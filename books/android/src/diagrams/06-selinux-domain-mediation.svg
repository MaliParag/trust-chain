<text x="460.0" y="259.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">SELinux LSM Hook Engine (avc_has_perm + allowxperm 16-bit ioctl Command Filter)</text>
<text x="460.0" y="278.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Default-deny over (scontext, tcontext, tclass, perm); restricts reachable driver ioctl subcommands</text>
