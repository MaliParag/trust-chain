<text x="40.0" y="381.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="start">ECIES: (K_enc, IV) = X9.63-KDF(e*P_i, Q_e || P_i)</text>
<text x="40.0" y="400.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">Encrypts Finder GPS via AES-128-GCM and uploads &lt;SHA-256(P_i),</text>
<text x="40.0" y="414.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">Q_e, C_loc, tag&gt; anonymously</text>
<rect x="469.0" y="344.0" width="425.0" height="87.1" rx="6.0" fill="#e6f4ec" stroke="#2b6a4c" stroke-width="1.4"/>
<text x="483.0" y="365.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#1e5139" text-anchor="start">OWNER RECOVERY (FIND MY.APP)</text>
<text x="483.0" y="381.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="start">d_i = (u_i*d_0 + v_i) mod q -&gt; ECDH(d_i, Q_e) = e*P_i</text>
<text x="483.0" y="400.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">Batch-queries Apple blind KV table by SHA-256(P_i) window and</text>
