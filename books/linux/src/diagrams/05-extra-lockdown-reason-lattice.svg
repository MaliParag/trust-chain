<rect x="26.0" y="52.0" width="868.0" height="73.0" rx="6.0" fill="#f4f1ea" stroke="#787167" stroke-width="1.4"/>
<text x="460.0" y="73.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#524c44" text-anchor="middle">LEVEL 0 · LOCKDOWN_NONE (LEGACY ROOT EQUIVALENCE)</text>
<text x="460.0" y="89.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">Unrestricted UID 0 Access to Ring 0 Memory, Hardware Buses, and Unverified kexec</text>
<text x="460.0" y="108.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Only irreversible upward transitions permitted: none -&gt; integrity -&gt; confidentiality (never downward until reset)</text>
<rect x="26.0" y="159.0" width="277.3" height="117.1" rx="6.0" fill="#e6f3f1" stroke="#236b66" stroke-width="1.4"/>
<text x="40.0" y="180.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#19524e" text-anchor="start">CODE &amp; BOOT GATES</text>
<text x="40.0" y="196.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="start">MODULE_SIGNATURE &amp; KEXEC</text>
<text x="40.0" y="215.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">Blocks unsigned .ko modules, raw</text>
<text x="40.0" y="229.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">kexec_load(), and unverified swsusp</text>
<text x="40.0" y="243.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">hibernation</text>
<rect x="321.3" y="159.0" width="277.3" height="117.1" rx="6.0" fill="#e6f3f1" stroke="#236b66" stroke-width="1.4"/>
<text x="335.3" y="180.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#19524e" text-anchor="start">MEMORY &amp; BUS GATES</text>
<text x="335.3" y="196.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="start">DEV_MEM, PCI_ACCESS, IOPORT,</text>
<text x="335.3" y="212.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="start">MSR</text>
<text x="335.3" y="230.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">Blocks /dev/mem, /dev/port, iopl(), raw PCI</text>
<text x="335.3" y="245.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">BAR DMA mmap, and WRMSR Ring 0 hooks</text>
<rect x="616.7" y="159.0" width="277.3" height="117.1" rx="6.0" fill="#f9f1e1" stroke="#b07926" stroke-width="1.4"/>
<text x="630.7" y="180.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#875a14" text-anchor="start">FIRMWARE &amp; DEBUG GATES</text>
<text x="630.7" y="196.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="start">ACPI_TABLES, DEVICE_TREE,</text>
<text x="630.7" y="212.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="start">BPF_WRITE</text>
<text x="630.7" y="230.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">Blocks custom AML SSDT tables,</text>
<text x="630.7" y="245.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">devicetree overrides, debugfs writes, and</text>
<text x="630.7" y="259.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">bpf_probe_write_user</text>
<rect x="26.0" y="334.1" width="868.0" height="73.0" rx="6.0" fill="#e6f4ec" stroke="#2b6a4c" stroke-width="1.4"/>
<text x="460.0" y="355.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#1e5139" text-anchor="middle">BARRIER 1 · LOCKDOWN_INTEGRITY_MAX (AUTO-ENABLED UNDER UEFI SECURE BOOT)</text>
<text x="460.0" y="371.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">security_locked_down(reason) Denies All Reason Codes &lt;= LOCKDOWN_INTEGRITY_MAX With -EPERM</text>
<text x="460.0" y="390.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Prevents UID 0 (even holding CAP_SYS_ADMIN and CAP_SYS_RAWIO) from modifying running Ring 0 code or state</text>
<rect x="26.0" y="441.1" width="425.0" height="87.1" rx="6.0" fill="#efeaf7" stroke="#5c4282" stroke-width="1.4"/>
<text x="40.0" y="462.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#452e66" text-anchor="start">CORE DUMP &amp; SECRET GATES</text>
<text x="40.0" y="478.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="start">KCORE &amp; XFRM_SECRET</text>
<text x="40.0" y="497.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">Blocks /proc/kcore physical RAM alias and IPsec cryptographic key</text>
<text x="40.0" y="511.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">extraction</text>
<rect x="469.0" y="441.1" width="425.0" height="87.1" rx="6.0" fill="#efeaf7" stroke="#5c4282" stroke-width="1.4"/>
<text x="483.0" y="462.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#452e66" text-anchor="start">INSTRUMENTATION GATES</text>
<text x="483.0" y="478.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="start">KPROBES, BPF_READ_KERNEL, PERF, TRACEFS</text>
<text x="483.0" y="497.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">Blocks kprobes, raw bpf_probe_read_kernel(), tracefs, and perf</text>
<text x="483.0" y="511.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="start">register sampling</text>
<rect x="26.0" y="586.2" width="868.0" height="73.0" rx="6.0" fill="#f8eaec" stroke="#8d2d3b" stroke-width="1.4"/>
<text x="460.0" y="607.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#6e1f2b" text-anchor="middle">BARRIER 2 · LOCKDOWN_CONFIDENTIALITY_MAX (APPLIANCE &amp; CONFIDENTIAL-HOST POSTURE)</text>
<text x="460.0" y="623.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.4" font-weight="700" fill="#1a1a1a" text-anchor="middle">security_locked_down(reason) Denies Both Integrity and Confidentiality Reason Codes</text>
<text x="460.0" y="642.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.7" font-weight="400" fill="#433e38" text-anchor="middle">Prevents UID 0 from reading dm-crypt master keys, keyring material, or guest secrets out of Ring 0 memory</text>
<text x="460.0" y="685.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Every privileged kernel interface passes an explicit enum lockdown_reason checked monotonically against kernel_locked_down.</text>
