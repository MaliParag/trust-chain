<text x="612.5" y="305.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="middle">Per-SID/group rules without PKI, but local</text>
<text x="612.5" y="319.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="middle">Admin stops service or edits registry rules</text>
<text x="277.5" y="418.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="700" fill="#365378" text-anchor="middle">Machine-Wide Policy</text>
<text x="612.5" y="418.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="700" fill="#365378" text-anchor="middle">Per-User / Group Scoping</text>
<text x="54.0" y="148.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="700" fill="#2b6a4c" text-anchor="middle">Admin-</text>
<text x="54.0" y="162.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="700" fill="#2b6a4c" text-anchor="middle">Resistant</text>
<text x="54.0" y="313.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="700" fill="#875a14" text-anchor="middle">Admin</text>
