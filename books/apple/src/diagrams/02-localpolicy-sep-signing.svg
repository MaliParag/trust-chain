<text x="48.0" y="667.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">iBoot Evaluates LocalPolicy Against SEP Counter</text>
<text x="48.0" y="686.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Verifies OIHR signature and monotonic counter before admitting AuxKC</text>
