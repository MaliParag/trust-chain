<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 689" width="900" height="689">
<rect x="0" y="0" width="900" height="689" fill="#ffffff"/>
<text x="450.0" y="24.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.0" font-weight="700" letter-spacing="0.90px" fill="#365378" text-anchor="middle">ANATOMY OF AN EBPF VERIFIER ESCAPE (CVE-2020-8835 / CVE-2021-3490 / CVE-2023-2163)</text>
<rect x="34.0" y="48.0" width="440.0" height="103.5" rx="6.0" fill="#edf1f6" stroke="#365378" stroke-width="1.4"/>
<text x="48.0" y="69.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#284163" text-anchor="start">STAGE 1 · BYTECODE LOAD</text>
<text x="48.0" y="85.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">bpf(BPF_PROG_LOAD) Submits Crafted Instruction</text>
<text x="48.0" y="101.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Graph</text>
<text x="48.0" y="120.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Attacker reaches bpf() via CAP_BPF, unprivileged BPF (when enabled),</text>
<text x="48.0" y="134.4" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">or leaked privileges</text>
<rect x="612.0" y="57.4" width="260.0" height="84.6" rx="6.0" fill="#e6f4ec" stroke="#2b6a4c" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="626.0" y="78.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#1e5139" text-anchor="start">HARDENING DEFAULT</text>
<text x="626.0" y="94.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.5" font-weight="700" fill="#1a1a1a" text-anchor="start">unprivileged_bpf_disabled=2</text>
<text x="626.0" y="111.8" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="400" fill="#433e38" text-anchor="start">Blocks unprivileged BPF_PROG_LOAD</text>
<text x="626.0" y="125.3" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.2" font-weight="400" fill="#433e38" text-anchor="start">across modern Linux fleets</text>
<rect x="34.0" y="209.5" width="440.0" height="103.5" rx="6.0" fill="#f9f1e1" stroke="#b07926" stroke-width="1.4"/>
<text x="48.0" y="231.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#875a14" text-anchor="start">STAGE 2 · ABSTRACT INTERPRETATION BUG</text>
<text x="48.0" y="247.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Verifier Bounds / Pruning State Diverges from CPU</text>
<text x="48.0" y="263.1" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Reality</text>
<text x="48.0" y="281.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Flawed ALU32 tnum tracking or register-parent pruning convinces</text>
<text x="48.0" y="295.9" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">verifier R6 == 0 while runtime R6 == 1</text>
<rect x="34.0" y="371.0" width="440.0" height="103.5" rx="6.0" fill="#f8eaec" stroke="#8d2d3b" stroke-width="1.4"/>
<text x="48.0" y="392.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#6e1f2b" text-anchor="start">STAGE 3 · DEAD-CODE / SCALE EXPLOITATION</text>
<text x="48.0" y="408.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">JIT Compiles Native Machine Code Without Runtime Bounds</text>
<text x="48.0" y="424.6" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Checks</text>
<text x="48.0" y="443.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Program multiplies fake-zero register R6 by large offset and adds to</text>
<text x="48.0" y="457.5" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">BPF map value pointer</text>
<rect x="34.0" y="532.5" width="440.0" height="103.5" rx="6.0" fill="#f8eaec" stroke="#8d2d3b" stroke-width="1.4"/>
<text x="48.0" y="554.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="9.2" font-weight="700" letter-spacing="0.40px" fill="#6e1f2b" text-anchor="start">STAGE 4 · ARBITRARY RING 0 READ/WRITE</text>
<text x="48.0" y="570.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">Out-of-Bounds Map Pointer Leaks KASLR &amp; Overwrites</text>
<text x="48.0" y="586.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start">task-&gt;cred</text>
<text x="48.0" y="604.7" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">Patches BPF map ops (btf_parse / map_push_elem) to gain arbitrary</text>
<text x="48.0" y="619.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.8" font-weight="400" fill="#433e38" text-anchor="start">kernel R/W and zero uid/euid</text>
<text x="450.0" y="660.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="10.5" font-weight="400" font-style="italic" fill="#57514a" text-anchor="middle">Because JIT-compiled eBPF runs natively inside Ring 0 without software fault isolation, verifier soundness is equivalent to kernel memory safety.</text>
<line x1="474.0" y1="99.8" x2="605.5" y2="99.8" stroke="#8d2d3b" stroke-width="1.5" stroke-dasharray="4,3"/>
<polygon points="612.0,99.8 603.5,95.8 603.5,103.8" fill="#8d2d3b"/>
<line x1="254.0" y1="151.5" x2="254.0" y2="203.0" stroke="#4a5568" stroke-width="1.5"/>
