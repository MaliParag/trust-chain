<text x="420.0" y="24.0" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif' font-size="11.0" font-weight="700" letter-spacing="0.90px" fill="#365378" text-anchor="middle">APPLICATION CONTROL DESIGN SPACE: ADMIN RESISTANCE VS. PER-USER GRANULARITY</text>
